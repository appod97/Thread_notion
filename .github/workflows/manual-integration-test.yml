name: Manual Notion Telegram integration test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Notion and Telegram integration
        env:
          SOURCE_MODE: sample
          DRY_RUN: 'false'
          THREADS_API_ENABLED: 'false'
          OPENAI_API_KEY: ''
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_TITLE_PROPERTY: Name
          NOTION_VERSION: '2026-03-11'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Verify integration report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/last_run.json').read_text(encoding='utf-8'))
          expected = {
              'fetched': 5,
              'duplicate_batch': 1,
              'relevant': 3,
              'failed': 0,
              'telegram_sent': True,
          }
          actual = {key: report.get(key) for key in expected}
          notion_processed = report.get('saved', 0) + report.get('duplicate_notion', 0)
          if (
              actual != expected
              or report.get('dry_run') is not False
              or notion_processed != 3
          ):
              raise SystemExit(
                  f'Integration validation failed: expected={expected}, actual={actual}, '
                  f'dry_run={report.get("dry_run")}, notion_processed={notion_processed}'
              )
          print(
              'Integration validation passed: '
              f'{actual}, saved={report.get("saved")}, '
              f'duplicate_notion={report.get("duplicate_notion")}'
          )
          PY
