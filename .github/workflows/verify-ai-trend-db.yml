name: Verify new AI Trend DB connection (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TARGET_DATA_SOURCE_ID: '406df156-2486-80ee-ab8d-000b5bb54685'
    steps:
      - name: Verify Notion API access and title property
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('NOTION_TOKEN')
          if not token: raise SystemExit('FAIL: NOTION_TOKEN secret is missing')
          url='https://api.notion.com/v1/data_sources/'+os.environ['TARGET_DATA_SOURCE_ID']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Notion-Version':'2026-03-11'})
          try:
              with urllib.request.urlopen(req,timeout=20) as f:
                  result=json.load(f)
          except urllib.error.HTTPError as e:
              raise SystemExit(f'FAIL: Notion returned HTTP {e.code}; share new DB with existing API integration') from None
          properties=result.get('properties',{})
          title_names=[k for k,v in properties.items() if v.get('type')=='title']
          if '트렌드' not in title_names:
              raise SystemExit('FAIL: Expected title property 트렌드; found '+str(title_names))
          print('PASS: Existing GitHub NOTION_TOKEN can access AI Trend DB')
          print('PASS: Database title property is 트렌드')
          print('PASS: Target data source matches new archive')
          PY
