
name: Verify Threads Search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-threads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Search Threads
      
      - name: Diagnose Threads API
        if: always()
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("THREADS_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("THREADS_ACCESS_TOKEN is missing")

          url = "https://graph.threads.net/v1.0/keyword_search"
          headers = {"Authorization": f"Bearer {token}"}

          for keyword in ["ChatGPT", "AI", "OpenAI"]:
              response = requests.get(
                  url,
                  headers=headers,
                  params={
                      "q": keyword,
                      "search_type": "RECENT",
                      "fields": "id,text,username,permalink,timestamp",
                      "limit": 10
                  },
                  timeout=30
              )

              print("Keyword:", keyword)
              print("HTTP:", response.status_code)

              result = response.json()
              print("Data count:", len(result.get("data", [])))
              print("Error:", result.get("error"))
              print("Paging exists:", bool(result.get("paging")))
              print("---")
          PY

        env:
          SOURCE_MODE: threads
          DRY_RUN: 'true'
          THREADS_API_ENABLED: 'true'
          THREADS_SEARCH_ENDPOINT: /v1.0/keyword_search
          THREADS_QUERIES: AI,OpenAI,ChatGPT,Gemini
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python -m src.main
