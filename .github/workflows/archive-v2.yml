name: AI Tech Trend Archive v2 manual dry run
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source type
        type: choice
        options: [sample, live]
        default: sample
permissions:
  contents: read
concurrency:
  group: ai-tech-v2
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Preview only (NO Notion or Telegram)
        env:
          ARCHIVE_V2_MODE: ${{ inputs.mode }}
          DRY_RUN: 'true'
          ENABLE_ARCHIVE_WRITES: 'false'
          THREADS_API_ENABLED: 'false'
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ''
        run: python -m src.archive_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-v2-report
          path: reports/last_run_v2.json
